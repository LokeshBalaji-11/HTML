<head>
    <style>
        .container{
            display: grid;
            border: 1px solid gold;
            grid: row 25% 25% 25% 25%;
            grid-column: 25% 25% 25% 25%;
            gap: 1px;
        }
        .header{
            background-color: orangered;
            height:25vh;
            grid-row: 1/2;
            grid-column:1/5;
        }
        .sb1{
            background-color: rgb(228, 178, 14);
            height: 25vh;
            grid-row: 2/3;
            grid-column: 1/2;
        }
         .sb2{
            background-color: rgb(221, 15, 176);
            height: 25vh;
            grid-row: 2/3;
            grid-column: 2/3;
        } .sb3{
            background-color: blueviolet;
            height: 25vh;
            grid-row: 2/3;
            grid-column: 3/4;
        } .sb{
            background-color:rgb(229, 11, 102);
            height: 50vh;
            grid-row: 2/4;
            grid-column: 4/5;
        }
        .main{
             background-color:rgb(57, 243, 6);
            height: 25vh;
            grid-row: 3/4;
            grid-column: 1/4;
        }
        .footer{
             background-color:rgb(12, 15, 168);
            height: 25vh;
            grid-row: 4/5;
            grid-column: 1/5;
        }
    </style>
</head>
<body>
   
        <div class="header">Header Elements 
            <span> Home</span>
            <span> About</span>
            <span> Login </span>
        </div>
        <div class="sb1">small box 1</div>
        <div class="sb2">small box 2</div>
        <div class="sb3">small box 3</div>
        <div class="sb"> Side Bar</div>
        <div class="main">Main content</div>
        <div class="footer"> Footer </div>
    </div>
</body>
